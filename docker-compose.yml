services:
  mysql:
    image: mysql:8.0
    container_name: property_mgmt_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_poc_password
      MYSQL_DATABASE: property_mgmt
      MYSQL_USER: pm_user
      MYSQL_PASSWORD: pm_pass
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - property_mgmt_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_poc_password"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  property_mgmt_mysql:
